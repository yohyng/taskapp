<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>アウトライン同期の回帰テスト</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import React from "react";
      import { createRoot } from "react-dom/client";
      import "/src/index.css";
      import Outliner, { OutlineProvider, useOutlineApi } from "/src/Outliner.jsx";

      function Probe() {
        const api = useOutlineApi();
        React.useEffect(() => { window.__outlineApi = api; }, [api]);
        return null;
      }
      const root = createRoot(document.getElementById("root"));
      window.__outlineUnmount = () => root.unmount();
      root.render(
        React.createElement(React.StrictMode, null,
          React.createElement(OutlineProvider, null, React.createElement(Probe), React.createElement(Outliner))),
      );
    </script>
  </body>
</html>
