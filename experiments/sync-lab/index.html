<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Task Space 同期検証</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#111827;color:#e5e7eb}main{max-width:900px;margin:40px auto;padding:0 24px}h1{font-size:24px}.notice{padding:12px;background:#1e293b;border-radius:8px;line-height:1.7}nav{display:flex;gap:8px;margin:20px 0}button{padding:8px 12px;border:1px solid #475569;border-radius:6px;background:#1e293b;color:inherit;cursor:pointer}article{display:flex;gap:12px;margin:8px 0;padding:12px;background:#1e293b;border-radius:8px}textarea{flex:1;min-width:0;font:inherit;color:inherit;background:transparent;border:0;resize:vertical}small{color:#94a3b8}#status{margin:16px 0}label{font-size:12px}input{accent-color:#34d399}#error{color:#fca5a5}
</style>
<main>
<h1>Task Space 同期の検証室</h1>
<div class="notice">Yjs / PowerSync / Loro案の試作・合成データ30行。本番とは独立しています。<br>URLのengine=powersync、engine=loroで方式を切り替えます。Loroの入力比較はinput=boundも付けます。同じ文書IDを別ブラウザーで開くと共有します。下の接続状態は、サーバーへの保存完了を示しません。</div>
<div id="status" data-status>手元のデータを読み込んでいます</div><div id="error" data-error role="alert"></div>
<nav><button data-disconnect>圏外にする</button><button data-connect>再接続</button><button data-undo>Undo</button><button data-redo>Redo</button><button data-check>サーバーの保存内容を確認</button></nav>
<small id="receipt"></small><div data-conflicts></div><section id="rows"></section>
</main><script type="module" src="/src/main.js"></script></html>
