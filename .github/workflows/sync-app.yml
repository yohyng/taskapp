name: 通常画面とPWAの保存・復帰
on:
  push:
    branches: ['codex/compare-sync-engines']
    paths: ['src/**', 'vite.config.js', 'index.html', 'package*.json', 'experiments/sync-lab/**', '!experiments/sync-lab/**/*.md', '.github/workflows/sync-app.yml']
  pull_request:
    paths: ['src/**', 'vite.config.js', 'index.html', 'package*.json', 'experiments/sync-lab/**', '!experiments/sync-lab/**/*.md', '.github/workflows/sync-app.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    # 同じPlaywright版のブラウザーとOS依存を固定し、外部aptミラー待ちを試験へ持ち込まない。
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --shm-size=1gb
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/sync-lab
    env:
      LAB_VERIFY_APP_PWA: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 既存の依存関係を取得
        run: |
          npm ci --prefix ../.. --ignore-scripts --no-audit --no-fund
          npm install -g pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm prepare:assets
      - name: 同梱ブラウザーの版を確認
        run: pnpm exec playwright --version
      - name: 通常入口の合成PWAを生成
        run: pnpm prepare:app
      - name: 普段の画面と全HTTP停止からの復帰を5回ずつ確認
        run: pnpm test tests/app-screen.spec.js tests/app-pwa.spec.js --repeat-each=5 --max-failures=2 --reporter=line,json > app-output.log 2>&1
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: app-results.json
      - name: 結果を表示
        if: always()
        run: cat app-output.log 2>/dev/null || true
      - name: 本文を含まない停止状態と合成試験のトレースを保管
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-app
          path: |
            experiments/sync-lab/app-results.json
            experiments/sync-lab/test-results/
          retention-days: 7
