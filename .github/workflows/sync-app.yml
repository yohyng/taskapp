name: 通常画面とPWAの保存・復帰
on:
  push:
    branches: ['codex/compare-sync-engines']
    paths: ['src/**', 'vite.config.js', 'index.html', 'package*.json', 'experiments/sync-lab/**', '!experiments/sync-lab/**/*.md', '.github/workflows/sync-app.yml']
  pull_request:
    paths: ['src/**', 'vite.config.js', 'index.html', 'package*.json', 'experiments/sync-lab/**', '!experiments/sync-lab/**/*.md', '.github/workflows/sync-app.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: experiments/sync-lab
    env:
      LAB_VERIFY_APP_PWA: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 既存の依存関係を取得
        run: |
          npm ci --prefix ../.. --ignore-scripts --no-audit --no-fund
          npm install -g pnpm@11.25.0
          pnpm install --frozen-lockfile
          pnpm prepare:assets
      - name: 外部ミラーの待ち時間を制限
        run: |
          printf '%s\n' 'Acquire::http::Timeout "60";' 'Acquire::https::Timeout "60";' 'Acquire::Retries "2";' | sudo tee /etc/apt/apt.conf.d/99-sync-app-timeout > /dev/null
      - name: ChromiumとWebKitを準備
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: 通常入口の合成PWAを生成
        run: pnpm prepare:app
      - name: 普段の画面と全HTTP停止からの復帰を確認
        run: pnpm test tests/app-screen.spec.js tests/app-pwa.spec.js --max-failures=2 --reporter=line,json > app-output.log 2>&1
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: app-results.json
      - name: 結果を表示
        if: always()
        run: cat app-output.log 2>/dev/null || true
      - name: 本文を含まない停止状態と合成試験のトレースを保管
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-app
          path: |
            experiments/sync-lab/app-results.json
            experiments/sync-lab/test-results/
          retention-days: 7
